name: 自动更新飞书数据

# 这个工作流的触发条件
on:
  # 1. 每天定时自动触发（cron 语法使用的是 UTC 时间）
  schedule:
    - cron: '0 0,12 * * *'
    
  # 2. 支持你在 GitHub 网页上点击按钮手动运行
  workflow_dispatch:
  
  # 3. 接受外部 Webhook (例如飞书) 发送的通知来触发
  repository_dispatch:
    types: [feishu_update]

jobs:
  update:
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: 把你的代码克隆到 GitHub 的云端电脑上
      - name: 检出当前代码
        uses: actions/checkout@v4
        
      # Step 2: 给云端电脑安装 Python
      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      # Step 3: 安装我们的脚本需要的额外库
      - name: 安装依赖 (requests)
        run: |
          python -m pip install --upgrade pip
          pip install requests
          
      # Step 4: 运行刚才我们修改好的爬取脚本
      - name: 运行拉取脚本
        run: |
          python scripts/fetch_feishu.py
          
      # Step 5: 把新拉取到的图片和 data.json 存回你的代码仓库
      - name: 自动提交和推送代码更改
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 自动化: 从飞书拉取最新已发布的记录"
          # 如果你的主分支叫 master，可以把 main 改成 master
          branch: main
